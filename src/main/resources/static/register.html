<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Must Network Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            padding-left: 20px;
            padding-right: 20px;
        }
        .box {
            background: #1e293b;
            padding: 30px 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #334155;
        }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; font-size: 22px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #0284c7; }
        .link { text-align: center; margin-top: 18px; font-size: 14px; }
        .link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Create Account</h1>
        <form id="registerForm" action="/api/auth/register" method="post">
            <label>Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label>Email</label>
            <input type="email" name="email" id="email" required>

            <label>Password</label>
            <input type="password" name="password" id="password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" id="confirm" required>

            <label>Role</label>
            <select id="role" required>
                <option value="">-- Select Role --</option>
                <option value="Student">Student</option>
                <option value="Teacher">Teacher</option>
                <option value="Supervisor">Supervisor</option>
            </select>

            <label>Department / Class (Optional)</label>
            <input type="text" id="department">

            <button type="submit">Create Account</button>
        </form>
        <div class="link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

   <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const fullname = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        const department = document.getElementById('department') ? document.getElementById('department').value : '';

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ fullname, email, password, role, department })
            });

            if (response.ok) {
                const user = await response.json();
                localStorage.setItem('nm_currentUser', JSON.stringify(user));
                alert('Account created successfully!');

                if (user.role === 'Supervisor') {
                    window.location.href = 'reports.html';
                } else {
                    window.location.href = 'welcome.html';
                }
            } else {
                const error = await response.json();
                alert(error.message || 'Registration failed');
            }
        } catch (error) {
            alert('Backend haifanyi kazi.');
        }
    });
</script>
</body>
</html>
