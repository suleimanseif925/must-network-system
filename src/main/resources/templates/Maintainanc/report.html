<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Problem - Must Network Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin-bottom: 25px; text-align: center; font-size: 22px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
        }
        textarea { resize: vertical; min-height: 100px; }
        .btns { display: flex; gap: 12px; }
        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .submit { background: #0ea5e9; color: white; }
        .back { background: #334155; color: white; }
        nav {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 14px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    border-radius: 10px;
}

.nav-brand {
    color: #38bdf8;
    font-size: 18px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 12px;
}

.nav-links a {
    color: #e2e8f0;
    text-decoration: none;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 6px;
}

.nav-links a:hover {
    background: #334155;
    color: #38bdf8;
}

.user-info {
    color: #94a3b8;
    font-size: 13px;
}

.logout-btn {
    background: #334155;
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
}
.nav-links a.active {
    background: #0ea5e9;
        color: white;
}
    </style>
</head>
<body>
    <nav>
    <div class="nav-brand">Must Network Maintenance</div>
    <div class="nav-links">
        <span class="user-info" id="userInfo"></span>
        <a href="welcome.html">Home</a>
        <a href="report.html">Report Problem</a>
        <a href="reports.html">View Reports</a>
     
    </div>
</nav>
    <div class="container">
        <div class="card">
            <h1>Report Network Problem</h1>
            <form id="reportForm">
                <label>Location</label>
                <input type="text" id="location" placeholder="Example: Computer Lab 2, Block A" required>

                <label>Type of Problem</label>
                <select id="problemType" required>
                    <option value="">-- Select Problem Type --</option>
                    <option value="Router Failure">Router Failure</option>
                    <option value="WiFi Failure">WiFi Failure</option>
                    <option value="Computer Not Connecting">Computer Not Connecting to Router</option>
                    <option value="Slow Network">Slow / Intermittent Network</option>
                    <option value="Other">Other Network Issue</option>
                </select>

                <label>Priority</label>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Critical">Critical</option>
                </select>

                <label>Short Description</label>
                <textarea id="description" placeholder="Describe the problem briefly..." required></textarea>

                <div class="btns">
                    <button type="button" class="back" onclick="window.location.href='welcome.html'">Back</button>
                    <button type="submit" class="submit">Submit Report</button>
                </div>
            </form>
        </div>
    </div>

   <script>
    const user = JSON.parse(localStorage.getItem('nm_currentUser'));
    if (!user) {
        window.location.href = 'login.html';
    }

    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const report = {
            problemType: document.getElementById('problemType').value,
            location: document.getElementById('location').value,
            priority: document.getElementById('priority').value,
            description: document.getElementById('description').value,
            reportedBy: user.fullname,
            role: user.role,
            email: user.email
        };

        try {
            const response = await fetch('http://localhost:8080/api/reports', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(report)
            });

            if (response.ok) {
                alert('Report submitted successfully!');
                window.location.href = 'reports.html';
            } else {
                alert('Failed to submit report');
            }
        } catch (error) {
            alert('Backend haifanyi kazi.');
        }
    });
</script>
</body>
</html>
