<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Must Network Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            padding-left: 20px;
            padding-right: 20px;
        }
        .box {
            background: #1e293b;
            padding: 30px 35px 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            line-height: 1.3;
            margin-bottom: 18px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-area img {
            width: 130px;
            height: auto;
            border-radius: 8px;
            background: white;
            padding: 5px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #38bdf8; }
        button {
            width: 100%;
            padding: 13px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0284c7; }
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
        .link a { color: #38bdf8; text-decoration: none; }
        .error {
            color: #f87171;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        img{
            height: 600;
            width: 800;
        }
        
    </style>
</head>
<body>
    <div class="box">
        <h1>Must Network<br>Maintenance</h1>

        <!-- Picture / Logo Section -->
        <div class="logo-area">
            <img src="Screenshot 2026-09-01 112027.png"height=600 , width="800" >
            <!-- Change "must-logo.png" to your actual image name -->
        </div>

        <p class="subtitle">Login to continue</p>
        <div class="error" id="error"></div>

        <form id="loginForm" action="@{/login}" method="post">
            <label>Username / Email</label>
            <input type="text" id="username" name="username" placeholder="Enter email or username" required>

            <label>Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <div class="link">
            Don't have an account? <a href="register.html">Create Account</a>
        </div>
    </div>

   <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const user = await response.json();
                localStorage.setItem('nm_currentUser', JSON.stringify(user));

                // Supervisor anaenda reports, wengine welcome
                if (user.role === 'Supervisor') {
                    window.location.href = 'reports.html';
                } else {
                    window.location.href = 'welcome.html';
                }
            } else {
                const err = document.getElementById('error');
                err.style.display = 'block';
                err.textContent = 'Email au Password si sahihi!';
            }
        } catch (error) {
            alert('Backend haifanyi kazi. Hakikisha Spring Boot inafanya kazi.');
        }
    });
</script>
</body>
</html>
